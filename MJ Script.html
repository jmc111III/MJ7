<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Midjourney v7 Prompt Generator</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #111;
      color: #eee;
      padding: 20px;
    }
    label {
      display: block;
      margin-top: 12px;
    }
    input, select, textarea {
      width: 100%;
      padding: 8px;
      margin-top: 4px;
      background: #222;
      color: #eee;
      border: 1px solid #444;
      border-radius: 4px;
    }
    button {
      margin-top: 20px;
      padding: 10px 20px;
      background-color: #4caf50;
      border: none;
      color: white;
      font-size: 16px;
      cursor: pointer;
      border-radius: 5px;
    }
    .output {
      margin-top: 20px;
      padding: 10px;
      background: #222;
      border: 1px solid #444;
      border-radius: 4px;
      font-family: monospace;
    }
  </style>
</head>
<body>
  <h1>🎨 Midjourney v7 Prompt Generator</h1>

  <label>Subject:</label>
  <input id="subject" placeholder="e.g., cyberpunk samurai">

  <label>Setting/Background:</label>
  <input id="setting" placeholder="e.g., neon-lit Tokyo alley">

  <label>Mood:</label>
  <input id="mood" placeholder="e.g., mysterious, epic">

  <label>Action:</label>
  <input id="action" placeholder="e.g., walking through rain">

  <label>Style:</label>
  <input id="style" placeholder="e.g., photorealistic, anime, Ghibli">

  <label>Medium:</label>
  <input id="medium" placeholder="e.g., watercolor, oil painting">

  <label>Artist/Influence:</label>
  <input id="artist" placeholder="e.g., Moebius, H.R. Giger">

  <label>Lighting:</label>
  <input id="lighting" placeholder="e.g., golden hour, neon shadows">

  <label>Camera Type/Angle:</label>
  <input id="camera" placeholder="e.g., wide shot, isometric">

  <label>Aspect Ratio (--ar):</label>
  <input id="aspect" placeholder="e.g., 16:9">

  <label>Quality/Style Flags (--v, --style):</label>
  <input id="quality" placeholder="e.g., --v 7 --style raw">

  <button onclick="generatePrompt()">Generate Prompt</button>

  <div class="output" id="output"></div>

  <script>
    function generatePrompt() {
      const fields = [
        "subject", "setting", "mood", "action", "style",
        "medium", "artist", "lighting", "camera"
      ];

      let promptParts = fields
        .map(id => document.getElementById(id).value.trim())
        .filter(Boolean);

      let prompt = promptParts.join(", ");

      const aspect = document.getElementById("aspect").value.trim();
      const quality = document.getElementById("quality").value.trim();

      if (aspect) prompt += ` --ar ${aspect}`;
      if (quality) prompt += ` ${quality}`;

      document.getElementById("output").textContent = prompt;
    }
  </script>
</body>
</html>
